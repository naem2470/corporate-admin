name: Autonomous Run

# Shipped inert. This job's own `if:` below only runs when the repository
# variable AUTONOMY_MODE equals "autonomous" -- a variable this repo never
# creates. See _company/autonomy.md for the full two-key contract; this
# workflow is one half of key 2, scripts/run-department.sh (which re-checks
# both keys independently) is the other.
#
# "Daily" cron is aspirational, not a guarantee: GitHub Actions cron has a
# five-minute floor, is routinely delayed under load, and GitHub disables
# scheduled workflows on a repo with no activity for 60 days.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      department:
        description: "One department folder name, or blank for every department"
        required: false
        default: ""
      dry_run:
        description: "Print the command per department, spend nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-run
  cancel-in-progress: false

jobs:
  run:
    name: Run armed departments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.AUTONOMY_MODE == 'autonomous'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUTONOMY_MODE: ${{ vars.AUTONOMY_MODE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run each department
        id: run
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" != "false" ]; then
            DRY="--dry-run"
          fi

          # workflow_dispatch may name one department. Schedule carries no
          # input at all, and an unset input defaults to empty, so both
          # cases fall through to "every real department".
          if [ -n "${{ inputs.department }}" ]; then
            targets="${{ inputs.department }}"
          else
            targets="$(find departments -mindepth 1 -maxdepth 1 -type d ! -name '_template' -printf '%f\n' | sort)"
          fi

          status=0
          for dept in $targets; do
            echo "::group::$dept"
            bash scripts/run-department.sh "$dept" $DRY || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Open a PR if a run produced changes
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes -- nothing to open a PR for (dry run, or every armed department was a no-op)."
            exit 0
          fi

          branch="autonomous-run/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "autonomous-run"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Autonomous run: $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create \
            --title "Autonomous run: $(date -u +%Y-%m-%d)" \
            --body "Opened by .github/workflows/autonomous-run.yml. Review before merging -- see _company/autonomy.md, 'What An Autonomous Run May Do': it may open this PR, it may not merge it." \
            --label "autonomous-run" \
            --base main
